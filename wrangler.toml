name = "wisp-server-workers"
main = "build/worker/shim.mjs"
compatibility_date = "2023-12-01"

[build]
command = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && export PATH=\"$HOME/.cargo/bin:$PATH\" && rustup target add wasm32-unknown-unknown && cargo install -q worker-build@^0.1 && worker-build --release"

[env.dev]
build = { command = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && export PATH=\"$HOME/.cargo/bin:$PATH\" && rustup target add wasm32-unknown-unknown && cargo install -q worker-build@^0.1 && worker-build --dev" }
